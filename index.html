<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADX x OS - Right Taskbar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* -------------------- CSS STYLES -------------------- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { overflow: hidden; height: 100vh; width: 100vw; background: #0a0a0a; }
        :root { --bg-color: rgba(20, 20, 20, 0.7); --text-color: white; --accent-color: #00d4ff; --glass-bg: rgba(255,255,255,0.05); }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseGlow { 0% { box-shadow: 0 0 5px #00d4ff; } 50% { box-shadow: 0 0 20px #00d4ff; } 100% { box-shadow: 0 0 5px #00d4ff; } }

        /* --- CINEMATIC INTRO (DYNAMIC) --- */
        #cinematicIntro { position: fixed; width: 100%; height: 100%; background: #000; z-index: 99999; display: none; justify-content: center; align-items: center; flex-direction: column; opacity: 0; transition: opacity 0.5s ease-out; }
        #cinematicIntro.active { display: flex; opacity: 1; }
        .cinematic-text { font-size: 90px; font-weight: bold; color: #00d4ff; text-shadow: 0 0 50px rgba(0, 212, 255, 0.5); letter-spacing: 5px; display: flex; flex-wrap: wrap; justify-content: center; }
        .cinematic-letter { display: inline-block; opacity: 0; transform: translateY(-100px); animation: letterDrop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes letterDrop { 0% { opacity: 0; transform: translateY(-100px) scale(0.5); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        
        /* ADMIN GRAND ENTRY */
        .admin-grand-entry { font-size: 100px; color: #ffd700; text-shadow: 0 0 100px rgba(255, 215, 0, 0.8); animation: grandZoom 4s ease-out forwards; }
        @keyframes grandZoom { 0% { transform: scale(0.1) rotate(-10deg); opacity: 0; } 50% { transform: scale(1.5) rotate(5deg); opacity: 1; } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }

        /* CINEMATIC INTRO SUBTITLE */
        .cinematic-sub { font-size: 24px; color: #aaa; margin-top: 20px; opacity: 0; animation: fadeIn 1s 3.5s forwards; }

        /* NEON BUTTONS */
        .neon-btn { position: relative; padding: 12px 24px; background: transparent; border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 8px; font-size: 16px; cursor: pointer; transition: 0.3s; overflow: hidden; }
        .neon-btn:hover { border-color: #00d4ff; color: #00d4ff; box-shadow: 0 0 20px rgba(0,212,255,0.2); }
        .neon-btn::before, .neon-btn::after { content: ''; position: absolute; width: 10px; height: 10px; background: transparent; transition: 0.5s; }
        .neon-btn::before { top: -2px; left: -2px; border-top: 2px solid white; border-left: 2px solid white; }
        .neon-btn::after { bottom: -2px; right: -2px; border-bottom: 2px solid white; border-right: 2px solid white; }
        .neon-btn:hover::before, .neon-btn:hover::after { width: calc(100% + 4px); height: calc(100% + 4px); border-color: #00d4ff; box-shadow: 0 0 20px rgba(0,212,255,0.5); }

        /* AUTH SCREEN */
        #authScreen { position: fixed; width: 100%; height: 100%; background: url('https://images.unsplash.com/photo-1477346611705-65d1883cee1e?q=80&w=2070&auto=format&fit=crop') no-repeat center center/cover; z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .auth-box { background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(15px); padding: 40px; border-radius: 20px; width: 350px; color: white; box-shadow: 0 20px 50px rgba(0,0,0,0.9); text-align: center; border: 1px solid rgba(255,255,255,0.1); animation: fadeIn 0.5s ease-out; }
        .auth-box h1 { font-size: 28px; margin-bottom: 5px; color: #00d4ff; text-shadow: 0 0 10px rgba(0,212,255,0.3); }
        .auth-input-group { display: flex; background: rgba(255,255,255,0.1); border-radius: 8px; margin-bottom: 15px; padding: 10px; align-items: center; transition: 0.3s; }
        .auth-input-group:focus-within { border: 1px solid #00d4ff; box-shadow: 0 0 15px rgba(0,212,255,0.2); }
        .auth-input-group i { color: #888; margin-right: 10px; }
        .auth-input-group input { background: transparent; border: none; color: white; width: 100%; outline: none; }
        #authBtn { width: 100%; padding: 12px; background: #00d4ff; color: #000; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        #authBtn:hover { background: #009ac7; }
        .auth-links { display: flex; justify-content: space-between; margin-top: 15px; font-size: 13px; color: #aaa; }
        .auth-links span { cursor: pointer; transition: 0.2s; }
        .auth-links span:hover { color: white; text-decoration: underline; }
        .auth-error { color: #ff4444; margin-top: 10px; font-size: 13px; }

        /* AUTH MODALS (Signup & Forgot) */
        .auth-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 10000; display: none; justify-content: center; align-items: center; }
        .auth-modal-overlay.active { display: flex; }
        .auth-modal { background: rgba(20, 20, 20, 0.95); padding: 40px; border-radius: 20px; width: 350px; color: white; box-shadow: 0 20px 50px rgba(0,0,0,0.9); text-align: center; border: 1px solid rgba(255,255,255,0.1); animation: slideUp 0.3s ease-out; }
        .auth-modal h2 { font-size: 22px; color: #00d4ff; margin-bottom: 20px; }
        .auth-modal .auth-input-group { margin-bottom: 15px; }
        .auth-modal .modal-btn { width: 100%; padding: 12px; background: #00d4ff; color: #000; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .auth-modal .modal-close { position: absolute; top: 15px; right: 20px; color: #aaa; cursor: pointer; font-size: 20px; }

        /* OS DESKTOP */
        #desktop { position: relative; width: 100vw; height: 100vh; display: none; background: #0a0a0a; }
        .wallpaper { position: absolute; width: 100%; height: 100%; background: url('https://images.unsplash.com/photo-1541701494587-cb58502866ab?q=80&w=2070&auto=format&fit=crop') no-repeat center center/cover; filter: blur(3px) brightness(0.4); z-index: -1; background-size: cover; background-position: center; transition: background-image 0.3s ease-out; }

        /* DYNAMIC NOTCH (TOP) */
        #notchContainer { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); width: 450px; height: 45px; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); border-radius: 25px; border: 1px solid rgba(255,255,255,0.1); z-index: 150; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
        #notchContainer .notch-left { display: flex; gap: 10px; }
        #notchContainer .notch-center { flex: 1; display: flex; justify-content: center; align-items: center; }
        #notchContainer .notch-right { display: flex; gap: 10px; }
        .notch-btn { background: transparent; border: none; color: #aaa; cursor: pointer; font-size: 16px; transition: 0.3s; padding: 5px 10px; border-radius: 5px; }
        .notch-btn:hover { color: #00d4ff; background: rgba(255,255,255,0.1); }
        #notchPopup { position: absolute; top: 55px; left: 50%; transform: translateX(-50%); width: 350px; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); border-radius: 10px; padding: 10px; color: white; text-align: center; font-size: 14px; border: 1px solid rgba(255,255,255,0.1); display: none; z-index: 151; animation: fadeIn 0.3s ease-out; }
        #notchPopup.active { display: block; }

        /* RIGHT SIDE TASKBAR (VERTICAL) */
        #dock { position: absolute; top: 80px; right: 15px; width: 60px; background: rgba(0,0,0,0.7); backdrop-filter: blur(15px); border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); z-index: 100; display: flex; flex-direction: column; gap: 10px; padding: 15px 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .dock-item { width: 40px; height: 40px; border-radius: 10px; background: rgba(255,255,255,0.05); display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.3s; color: #ddd; font-size: 16px; border: 1px solid transparent; }
        .dock-item:hover { background: rgba(0, 212, 255, 0.2); border-color: #00d4ff; transform: translateX(-5px); box-shadow: 0 5px 15px rgba(0,212,255,0.2); }
        .dock-item img { width: 20px; height: 20px; }

        /* CENTER APPS SQUARE */
        #centerAppBtn { position: absolute; bottom: 20px; right: 20px; width: 50px; height: 50px; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); border-radius: 15px; border: 1px solid rgba(255,255,255,0.2); display: none; justify-content: center; align-items: center; cursor: pointer; z-index: 100; transition: 0.3s; color: white; font-size: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
        #centerAppBtn:hover { background: rgba(0, 212, 255, 0.3); border-color: #00d4ff; transform: scale(1.1); }
        #centerAppSquare { position: absolute; bottom: 80px; right: 20px; width: 280px; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); padding: 15px; display: none; z-index: 101; box-shadow: 0 20px 50px rgba(0,0,0,0.9); grid-template-columns: 1fr 1fr; gap: 10px; }
        #centerAppSquare.active { display: grid; }
        .center-app-item { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 10px; cursor: pointer; transition: 0.3s; color: white; }
        .center-app-item:hover { background: rgba(0, 212, 255, 0.2); transform: scale(1.05); }
        .center-app-item i { font-size: 20px; margin-bottom: 5px; }
        .center-app-item span { font-size: 11px; text-align: center; }

        /* WINDOW SYSTEM (GLASSMORPHISM) */
        .window { position: absolute; background: rgba(30, 30, 30, 0.85); backdrop-filter: blur(20px); border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.9); border: 1px solid rgba(255,255,255,0.1); display: none; overflow: hidden; z-index: 50; animation: fadeIn 0.4s ease-out; }
        .window-header { padding: 10px 15px; background: rgba(0,0,0,0.3); cursor: grab; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .window-title { font-weight: bold; font-size: 13px; display: flex; align-items: center; gap: 8px; color: #ddd; }
        .window-controls { display: flex; gap: 5px; }
        .win-btn { background: transparent; border: none; color: #aaa; cursor: pointer; padding: 2px 6px; border-radius: 4px; transition: 0.2s; font-size: 12px; }
        .win-btn:hover { background: rgba(255,255,255,0.1); color: white; }
        .win-btn.close:hover { background: #ff4444; color: white; }
        .win-btn.multitask:hover { background: #00d4ff; color: #000; }
        .win-btn.fullscreen:hover { background: #00d4ff; color: #000; }
        .window-content { padding: 0; height: calc(100% - 40px); overflow: hidden; background: transparent; }
        .window-content iframe { width: 100%; height: 100%; border: none; background: #111; }

        /* MULTITASKING OVERLAY (Background Grid) */
        #multitaskOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 200; display: none; justify-content: center; align-items: center; flex-wrap: wrap; gap: 10px; padding: 20px; }
        #multitaskOverlay.active { display: flex; }
        .mt-window { background: rgba(30, 30, 30, 0.9); backdrop-filter: blur(10px); border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); width: 48%; height: 48%; overflow: hidden; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .mt-window iframe { width: 100%; height: 100%; border: none; }
        .mt-window .mt-controls { position: absolute; top: 10px; right: 10px; display: flex; gap: 5px; z-index: 10; }
        .mt-window .mt-controls button { background: rgba(0,0,0,0.6); border: none; color: white; padding: 5px 8px; border-radius: 5px; cursor: pointer; font-size: 12px; transition: 0.2s; }
        .mt-window .mt-controls button:hover { background: rgba(255,255,255,0.2); }
        
        /* TEXT EDITOR APP */
        .text-editor-container { display: flex; height: 100%; width: 100%; background: #1a1a1a; }
        .text-editor-line-num { width: 40px; height: 100%; background: #2a2a2a; color: #888; padding: 10px 5px; text-align: right; font-family: monospace; font-size: 14px; overflow-y: hidden; border-right: 1px solid #444; user-select: none; line-height: 1.5; }
        .text-editor-area { flex: 1; height: 100%; background: #1a1a1a; color: #00ff00; border: none; padding: 10px; font-family: monospace; font-size: 14px; resize: none; outline: none; line-height: 1.5; overflow-y: auto; }

        /* SETTINGS APP STYLES */
        .settings-container { padding: 20px; color: white; height: 100%; overflow-y: auto; }
        .settings-container h2 { color: #00d4ff; margin-bottom: 20px; }
        .settings-section { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 15px; margin-bottom: 15px; border-left: 4px solid #00d4ff; }
        .settings-section h3 { font-size: 14px; color: #aaa; margin-bottom: 5px; }
        .settings-section p { font-size: 14px; }
        .settings-section a { color: #00d4ff; text-decoration: none; }
        .settings-btn { background: #00d4ff; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 5px; }

        /* VPN APP STYLES */
        .vpn-container { padding: 20px; color: white; height: 100%; overflow-y: auto; }
        .vpn-container h2 { color: #00d4ff; margin-bottom: 15px; }
        .vpn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .vpn-card { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; transition: 0.3s; border: 1px solid transparent; }
        .vpn-card:hover { background: rgba(0, 212, 255, 0.2); border-color: #00d4ff; transform: scale(1.05); }
        .vpn-card .flag { font-size: 30px; margin-bottom: 5px; }
        .vpn-card .name { font-size: 14px; font-weight: bold; }
        .vpn-card .status { font-size: 11px; color: #888; margin-top: 5px; }
        .vpn-card.connected { border-color: #00ff00; background: rgba(0, 255, 0, 0.1); }

        /* AI WINDOW (Draggable) */
        .ai-window { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); width: 400px; height: 450px; background: rgba(20,20,20,0.95); backdrop-filter: blur(15px); border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); z-index: 500; flex-direction: column; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.9); display: none; }
        .ai-window .ai-header { padding: 12px; background: rgba(0,0,0,0.5); border-bottom: 1px solid rgba(255,255,255,0.1); cursor: grab; display: flex; justify-content: space-between; align-items: center; }
        .ai-window .ai-header h3 { color: #00d4ff; font-size: 16px; display: flex; align-items: center; gap: 10px; }
        .ai-window .ai-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .ai-window .ai-msg { max-width: 80%; padding: 10px; border-radius: 10px; font-size: 14px; }
        .ai-window .ai-msg.bot { background: #333; align-self: flex-start; }
        .ai-window .ai-msg.user { background: #00d4ff; color: #000; align-self: flex-end; }
        .ai-window .ai-input-area { padding: 15px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; gap: 10px; background: rgba(0,0,0,0.5); }
        .ai-window .ai-input { flex: 1; padding: 10px; border-radius: 20px; border: none; background: #333; color: white; outline: none; }
        .ai-window .ai-mic-btn { background: #ff4444; border: none; color: white; padding: 0 15px; border-radius: 20px; cursor: pointer; transition: 0.3s; }
        .ai-window .ai-mic-btn.active { background: #00ff00; animation: pulseGlow 1s infinite; }
        .ai-window .ai-send-btn { background: #00d4ff; border: none; color: #000; padding: 0 20px; border-radius: 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <!-- LOGIN SCREEN -->
    <div id="authScreen">
        <div class="auth-box">
            <h1><i class="fas fa-microchip"></i> ADX x OS</h1>
            <p>Ultimate Experience</p>
            <div class="auth-input-group"><i class="fas fa-user"></i><input type="text" id="authUser" placeholder="Username"></div>
            <div class="auth-input-group"><i class="fas fa-lock"></i><input type="password" id="authPass" placeholder="Password"></div>
            <button id="authBtn" class="neon-btn" onclick="handleAuth()">Login</button>
            <div class="auth-links">
                <span onclick="openSignupModal()">Create New Account</span>
                <span onclick="openForgotModal()">Forgot Password?</span>
            </div>
            <div id="authError" class="auth-error"></div>
        </div>
    </div>

    <!-- CINEMATIC INTRO (Login ke baad) -->
    <div id="cinematicIntro">
        <div id="cinematicTextContainer" class="cinematic-text"></div>
        <div id="cinematicSubtitle" class="cinematic-sub"></div>
    </div>

    <!-- SIGNUP MODAL -->
    <div class="auth-modal-overlay" id="signupModal">
        <div class="auth-modal" style="position:relative;">
            <span class="modal-close" onclick="closeAuthModals()">&times;</span>
            <h2>Create New Account</h2>
            <div class="auth-input-group"><i class="fas fa-user"></i><input type="text" id="modalSignupUser" placeholder="Choose Username"></div>
            <div class="auth-input-group"><i class="fas fa-lock"></i><input type="password" id="modalSignupPass" placeholder="Choose Password"></div>
            <button class="modal-btn" onclick="handleSignup()">Sign Up</button>
            <div id="modalSignupError" style="color:#ff4444; margin-top:10px; font-size:13px;"></div>
        </div>
    </div>

    <!-- FORGOT PASSWORD MODAL -->
    <div class="auth-modal-overlay" id="forgotModal">
        <div class="auth-modal" style="position:relative;">
            <span class="modal-close" onclick="closeAuthModals()">&times;</span>
            <h2>Reset Password</h2>
            <div class="auth-input-group"><i class="fas fa-user"></i><input type="text" id="modalForgotUser" placeholder="Enter Username"></div>
            <button class="modal-btn" onclick="handleForgot()">Send to Admin</button>
            <div id="modalForgotError" style="color:#ff4444; margin-top:10px; font-size:13px;"></div>
        </div>
    </div>

    <!-- MAIN OS DESKTOP -->
    <div id="desktop">
        <div class="wallpaper" id="wallpaperContainer"></div>
        
        <!-- DYNAMIC NOTCH -->
        <div id="notchContainer">
            <div class="notch-left">
                <button class="notch-btn" onclick="toggleAI()"><i class="fas fa-robot"></i></button>
                <button class="notch-btn" onclick="showMultitask()"><i class="fas fa-th-large"></i></button>
            </div>
            <div class="notch-center">
                <span style="color:#aaa; font-size:12px; letter-spacing:2px;">ADX x OS</span>
            </div>
            <div class="notch-right">
                <button class="notch-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
            </div>
            <div id="notchPopup"></div>
        </div>

        <!-- CENTER APPS SQUARE -->
        <div id="centerAppBtn" onclick="toggleCenterSquare()">
            <i class="fas fa-plus"></i>
        </div>
        <div id="centerAppSquare">
            <div class="center-app-item" onclick="openCustomApp('notes')"><i class="fas fa-sticky-note" style="color:lightgreen;"></i><span>Notes</span></div>
            <div class="center-app-item" onclick="openCustomApp('vpn')"><i class="fas fa-shield-alt" style="color:#00ff00;"></i><span>ADX VPN</span></div>
            <div class="center-app-item" onclick="openCustomApp('weather')"><i class="fas fa-cloud-sun-rain" style="color:#ffcc00;"></i><span>Weather Hacker</span></div>
            <div class="center-app-item" onclick="openCustomApp('osint')"><i class="fas fa-search" style="color:#00ff00;"></i><span>OSINTALL</span></div>
            <div class="center-app-item" onclick="openCustomApp('settings')" style="grid-column: span 2;"><i class="fas fa-cog" style="color:white;"></i><span>Settings</span></div>
        </div>

        <!-- RIGHT SIDE TASKBAR (VERTICAL) -->
        <div id="dock">
            <div class="dock-item" onclick="openApp('https://www.google.com/webhp?igu=1', 'Chrome')"><img src="https://upload.wikimedia.org/wikipedia/commons/e/e1/Google_Chrome_icon_%28February_2022%29.svg"></div>
            <div class="dock-item" onclick="openApp('https://www.online-python.com/', 'Python')"><i class="fab fa-python" style="color:#3776ab;"></i></div>
            <div class="dock-item" onclick="openApp('https://prompt-pal-ai-82.lovable.app/', 'Prompt Pal')"><i class="fas fa-wand-magic-sparkles" style="color:#ffaa00;"></i></div>
            <div class="dock-item" onclick="openApp('https://jarvis-six-gamma.vercel.app/', 'Jarvis Adv')"><i class="fas fa-robot" style="color:cyan;"></i></div>
            <div class="dock-item" onclick="openApp('https://adxui-tfl7480.public.builtwithrocket.new/', 'ADX AI')"><i class="fas fa-brain" style="color:#ff69b4;"></i></div>
            <div class="dock-item" onclick="openCustomApp('games')"><i class="fas fa-gamepad" style="color:#ffaa00;"></i></div>
            <div class="dock-item" onclick="openCustomApp('texteditor')"><i class="fas fa-file-alt" style="color:#ffffff;"></i> Editor</div>
            <div class="dock-item" onclick="openCustomApp('codepad')"><i class="fas fa-code" style="color:#00ff00;"></i></div>
        </div>

        <!-- MULTITASKING OVERLAY -->
        <div id="multitaskOverlay"></div>

        <div id="windowContainer"></div>

        <!-- AI WINDOW -->
        <div class="ai-window" id="aiWindow">
            <div class="ai-header" id="aiHeader">
                <h3><i class="fas fa-brain" style="color:#00d4ff;"></i> ADX Vision AI</h3>
                <button onclick="toggleAI()" style="background:none; border:none; color:white; cursor:pointer; font-size:16px;">✕</button>
            </div>
            <div class="ai-messages" id="aiMessages">
                <div class="ai-msg bot">🔥 I'm savage. Tell me what to write and where. Example: "Write Python scraper in Text Editor".</div>
            </div>

        function startContinuousListening() {
            if(!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("Speech Recognition not supported. Use Chrome.");
                document.getElementById('aiMicBtn').classList.remove('active');
                return;
            }
            
            if(recognition && isListening) return;
            
            recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'en-US';
            recognition.continuous = true;
            recognition.interimResults = false;
            
            recognition.onstart = () => {
                isListening = true;
            };
            
            recognition.onresult = (event) => {
                for(let i = event.resultIndex; i < event.results.length; i++) {
                    if(event.results[i].isFinal) {
                        const transcript = event.results[i][0].transcript;
                        document.getElementById('aiInput').value = transcript;
                        sendAIMessage();
                    }
                }
            };
            
            recognition.onerror = (event) => {
                if(event.error === 'not-allowed') {
                    showNotchPopup("🚫 Mic access denied!", 3000);
                    document.getElementById('aiMicBtn').classList.remove('active');
                    isListening = false;
                } else if(event.error === 'no-speech') {
                    setTimeout(() => {
                        if(document.getElementById('aiMicBtn').classList.contains('active')) {
                            recognition.start();
                        }
                    }, 100);
                }
            };
            
            recognition.onend = () => {
                isListening = false;
                if(document.getElementById('aiMicBtn').classList.contains('active')) {
                    setTimeout(() => {
                        recognition.start();
                    }, 100);
                }
            };
            
            recognition.start();
        }

        function updateLineNumbers() {

            lineNumDiv.innerText = numStr;

        /* --- SNAKE GAME --- */
        let snake, food, direction, nextDirection, score, gameInterval;
        function initSnake() {
            const canvas = document.getElementById('snakeCanvas');
            if(!canvas) return;
            snake = [{x: 10, y: 10}]; food = {x: 15, y: 15}; direction = 'RIGHT'; nextDirection = 'RIGHT'; score = 0;
            if(gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(() => {
                direction = nextDirection;
                const head = {...snake[0]};
                if(direction === 'RIGHT') head.x += 1;
                if(direction === 'LEFT') head.x -= 1;
                if(direction === 'UP') head.y -= 1;
                if(direction === 'DOWN') head.y += 1;
                
                if(head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 20 || snake.some(s => s.x === head.x && s.y === head.y)) {
                    clearInterval(gameInterval); showNotchPopup("Game Over! Score: " + score, 3000); return;
                }
                snake.unshift(head);
                if(head.x === food.x && head.y === food.y) { score += 10; food = {x: Math.floor(Math.random() * 20), y: Math.floor(Math.random() * 20)}; }
                else { snake.pop(); }
                
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#222'; ctx.fillRect(0, 0, 400, 400);
                ctx.fillStyle = '#00ff00'; snake.forEach(s => ctx.fillRect(s.x * 20, s.y * 20, 18, 18));
                ctx.fillStyle = '#ff4444'; ctx.fillRect(food.x * 20, food.y * 20, 18, 18);
            }, 150);
            document.addEventListener('keydown', (e) => {
                if(e.key === 'ArrowUp' && direction !== 'DOWN') nextDirection = 'UP';
                if(e.key === 'ArrowDown' && direction !== 'UP') nextDirection = 'DOWN';
                if(e.key === 'ArrowLeft' && direction !== 'RIGHT') nextDirection = 'LEFT';
                if(e.key === 'ArrowRight' && direction !== 'LEFT') nextDirection = 'RIGHT';
            });
        }
